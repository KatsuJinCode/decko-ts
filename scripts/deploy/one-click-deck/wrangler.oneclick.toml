# GENERATED by scripts/deploy/one-click-deck/one-click-deck.mjs — the one-click
# deploy config. Regenerated idempotently; the database_id is rewritten once
# 'wrangler d1 create' has printed the real id (--execute mode). The placeholder
# below is fine for LOCAL use: local D1 is a workerd-side sqlite keyed by id,
# never contacted.
#
# No nodejs_compat: the worker graph is Web-standard-only; the one Node import
# in the engine graph (node:crypto) is replaced at bundle time by the [alias]
# shim (same shape as deploy/wrangler.toml).
#
# [assets] ships the compiled skin (all-style.css + all-script.js) plus
# decko-config.js and robots.txt. The assets layer serves them BEFORE the
# worker runs, so asset requests cost zero D1 reads and zero D1 writes;
# crawler traffic is turned away by robots.txt instead of burning the read
# budget.

name = "decko-one-click-demo"
main = "../../../deploy/worker.ts"
compatibility_date = "2026-08-01"

[alias]
"node:crypto" = "../../../deploy/shims/node-crypto-shim.ts"

[assets]
directory = "demo-static-assets"

[[d1_databases]]
binding = "DB"
database_name = "decko-one-click-db"
database_id = "00000000-0000-0000-0000-000000000001"
