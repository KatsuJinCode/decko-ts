# cs-deck-bunny-origin nginx — public reverse proxy in front of the
# decko-bunny-origin Node service running on 127.0.0.1:3200.
#
# Bunny CDN pulls from this URL via http://170.9.231.182:3001/_status, etc.
# Keep the upstream loopback-only; this listener is the only external surface.

server {
    listen 3001 default_server;
    listen [::]:3001 default_server;
    server_name _;

    access_log /var/log/nginx/cs-deck-bunny-origin.access.log;
    error_log  /var/log/nginx/cs-deck-bunny-origin.error.log;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Path safety — the upstream decodes the URL the engine-canonical
        # way; keep the proxy dumb.
    }
}
