# cs-deck-bunny-origin-8443 — public reverse proxy on 8443 (which is
# already in the OCI ingress allow-list: 0.0.0.0/0 → dpt:8443). We add a
# second vhost on the same port that matches the Bunny CDN's pull host
# header and proxies to 127.0.0.1:3200. The existing site-demo-8443 vhost
# (server_name _) keeps serving the Rails demo as before.

server {
    # Listen only on the Bunny-CDN-mapped hostnames so we don't collide
    # with the existing site-demo vhost (also bound to 8443, server_name _).
    # Bunny CDN pulls this origin over plain HTTP (its OriginUrl is
    # http://170.9.231.182:8443 in this layout), so the TLS terminate is
    # at the Bunny edge, not here — we don't need ssl_certificate on this
    # listener. If a future lane switches the OriginUrl to https, paste
    # the bunny-issued cert paths in and re-enable ssl_certificate.
    listen 8443;
    listen [::]:8443;
    server_name cs-deck.b-cdn.net;

    access_log /var/log/nginx/cs-deck-bunny-origin-8443.access.log;
    error_log  /var/log/nginx/cs-deck-bunny-origin-8443.error.log;

    # No auth_basic — this is between the Bunny CDN and us, not a user-
    # facing surface. Bunny CDN has its own edge.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
