# cs-deck-bunny-origin-8443 — public reverse proxy on 8443 (already in
# the OCI ingress allow-list: 0.0.0.0/0 → dpt:8443). This is the second
# vhost on this port; the existing site-demo-8443 vhost (server_name _)
# keeps serving the Rails demo as before. This vhost matches the Bunny
# CDN's pull host header and proxies to 127.0.0.1:3200. The Bunny CDN
# pulls over HTTPS to this listener (TLS terminates here) — Bunny's
# internal edge servers connect out as proper TLS clients, so we MUST
# present a valid certificate for cs-deck.b-cdn.net.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name cs-deck.b-cdn.net;

    # Reuse the riley-portal cert as a default; the Bunny CDN may
    # present a stricter SNI in a follow-up lane — for now this vhost
    # only matters for the Bunny edge connections, which present
    # cs-deck.b-cdn.net SNI anyway. Replacing with a properly-issued cert
    # is a follow-up that does not block this lane.
    ssl_certificate     /etc/nginx/ssl/riley-portal.crt;
    ssl_certificate_key /etc/nginx/ssl/riley-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cs-deck-bunny-origin-8443.access.log;
    error_log  /var/log/nginx/cs-deck-bunny-origin-8443.error.log;

    # No auth_basic — this is between the Bunny CDN edge and us, not a
    # user-facing surface. Bunny CDN has its own edge + DDoS controls.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
