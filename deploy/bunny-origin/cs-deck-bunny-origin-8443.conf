# cs-deck-bunny-origin-8443 — public reverse proxy on 8443 (which is
# already in the OCI ingress allow-list: 0.0.0.0/0 → dpt:8443). We add a
# second vhost on the same port that matches the Bunny CDN's pull host
# header and proxies to 127.0.0.1:3200. The existing site-demo-8443 vhost
# (server_name _) keeps serving the Rails demo as before.

server {
    # Listen only on the Bunny-CDN-mapped hostnames so we don't collide
    # with the existing site-demo vhost (also bound to 8443, server_name _).
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name cs-deck.b-cdn.net;

    # Bunny CDN L7 hostname = cs-deck.b-cdn.net (the pull zone's hostname).
    # We MUST present a TLS certificate valid for that hostname; the
    # Let's Encrypt provision flow on the pull zone mints one, but since
    # the Bunny CDN uses HTTP→Origin (not HTTPS), we accept the Bunny
    # edge handling TLS at the edge and serving plain HTTP upstream.
    #
    # Re-enable when Bunny is configured for HTTPS origin (currently
    # OriginUrl is plain http://170.9.231.182:8443).
    # ssl_certificate     /etc/nginx/ssl/cs-deck.b-cdn.net.crt;
    # ssl_certificate_key /etc/nginx/ssl/cs-deck.b-cdn.net.key;
    # ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cs-deck-bunny-origin-8443.access.log;
    error_log  /var/log/nginx/cs-deck-bunny-origin-8443.error.log;

    # No auth_basic — the Bunny CDN has its own edge; this is between us
    # and Bunny (and currently Bunny pulls over plain HTTP, so the
    # listen-directive TLS bits above are commented out accordingly).
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
