# The deck file is always given by DATABASE_URL (the harness points it at a
# per-run copy). The paths below are only fallbacks for manual use.
shared:
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  database: db/development.sqlite3

test:
  database: db/test.sqlite3

production:
  database: db/production.sqlite3
